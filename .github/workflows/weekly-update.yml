name: weekly-update

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday 14:17 UTC (about 6-7 am Pacific)
  workflow_dispatch:         # allows "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "numpy" "pandas>=2.0" "requests" "matplotlib"

      - name: Build site
        env:
          ONC_TOKEN: ${{ secrets.ONC_TOKEN }}
        run: python generate_site.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "Weekly update $(date -u +%F)" && git push)
